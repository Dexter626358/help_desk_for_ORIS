[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsas"
version = "0.1.0"
description = "IPSAS — Internal Publishing Support System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0.0",
  "Werkzeug>=3.0.0",
  "lxml>=5.0.0",
  "PyPDF2>=3.0.0",
  "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
ipsas = "ipsas.cli:main"
ipsas-web = "run:main"

[tool.setuptools.packages.find]
include = ["ipsas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
