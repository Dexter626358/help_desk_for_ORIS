[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsas"
version = "0.1.0"
description = "IPSAS — Internal Publishing Support System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0.0,<3.2",
  "Werkzeug>=3.0.0,<3.2",
  "Flask-WTF>=1.2.0,<2",
  "WTForms>=3.0.0,<4",
  "lxml>=5.0.0,<6",
  "PyPDF2>=3.0.0,<4",
  "gunicorn>=21.2.0,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "ruff>=0.6.0,<1",
  "pip-audit>=2.7.0,<3",
]

[project.scripts]
ipsas = "ipsas.cli:main"
ipsas-web = "run:main"

[tool.setuptools.packages.find]
include = ["ipsas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
