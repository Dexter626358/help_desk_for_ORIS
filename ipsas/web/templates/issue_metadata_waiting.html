{% extends "base.html" %}

{% block title %}Парсинг выпуска — IPSAS{% endblock %}

{% block content %}
<div class="card">
  <h1 style="margin-bottom: 1rem; color: #667eea;">Парсинг выпуска запущен</h1>

  <div style="background-color: #f8f9fa; padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 1rem;">
    <div style="color:#333; font-weight: 600;">Ссылка:</div>
    <div style="color:#666; margin-top: 0.25rem; word-break: break-all;">{{ issue_url }}</div>
  </div>

  <div id="status" style="padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #e0e0e0; background: #fff;">
    Ожидайте… идёт парсинг.
  </div>
  <div id="elapsed" style="margin-top: 0.6rem; color:#666;"></div>

  <div style="margin-top: 1.25rem; display:flex; gap: 0.5rem; flex-wrap: wrap;">
    <a class="btn btn-secondary" href="{{ url_for('issue_metadata.issue_metadata_page') }}">Назад</a>
    <a class="btn btn-secondary" href="{{ url_for('issue_metadata.issue_metadata_task_result', task_id=task_id) }}">Обновить</a>
  </div>
</div>

<script>
  const statusUrl = "{{ url_for('issue_metadata.issue_metadata_task_status', task_id=task_id) }}";
  const resultUrl = "{{ url_for('issue_metadata.issue_metadata_task_result', task_id=task_id) }}";

  async function poll() {
    try {
      const r = await fetch(statusUrl, { headers: { "Accept": "application/json" } });
      const data = await r.json();
      if (data.status === "done") {
        window.location.href = data.redirect || resultUrl;
        return;
      }
      if (data.status === "error") {
        document.getElementById("status").textContent = "Ошибка: " + (data.error || "Неизвестная ошибка");
        return;
      }
      if (data.status === "running") {
        document.getElementById("elapsed").textContent = `Идёт ${data.elapsed_s || 0}с…`;
      }
    } catch (e) {
      document.getElementById("elapsed").textContent = "Не удалось получить статус. Повторяем…";
    }
    setTimeout(poll, 3000);
  }

  poll();
</script>
{% endblock %}
