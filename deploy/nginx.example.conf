# Пример reverse-proxy для IPSAS (внутренняя сеть организации).
# Подставьте пути к сертификатам и список разрешённых IP.

upstream ipsas_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name ipsas.example.org;

    # ssl_certificate     /etc/ssl/certs/ipsas.crt;
    # ssl_certificate_key /etc/ssl/private/ipsas.key;

    client_max_body_size 12m;

    # Ограничение доступа к внутренней сети (раскомментируйте и настройте)
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # Альтернатива: Basic Auth
    # auth_basic "IPSAS";
    # auth_basic_user_file /etc/nginx/ipsas.htpasswd;

    location /health {
        proxy_pass http://ipsas_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://ipsas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
