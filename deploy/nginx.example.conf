# Reverse-proxy для IPSAS: доступ по IP, обычный HTTP, без авторизации.
#
# Конфигурация под текущую задачу: сервис открыт по http://<ip-сервера>,
# TLS и пароль не используются. Готов к применению как есть.
#
# ВАЖНО, две связанные настройки при такой схеме:
#   1) в /etc/ipsas/ipsas.env должно быть SESSION_COOKIE_SECURE=false
#      (в production cookie по умолчанию Secure, и по http:// браузер её
#      не примет -> все формы начнут отбиваться ошибкой CSRF);
#   2) TRUST_PROXY_HEADERS=true (см. deploy/ipsas.env.production.example),
#      иначе все пользователи делят один лимит запросов.

upstream ipsas_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Порт 80: если сервис должен быть единственным на этой машине, оставьте
# `default_server`. Если порт уже занят другим сайтом, уберите его.
server {
    listen 80 default_server;
    server_name _;

    # Верхний лимит на размер запроса. Должен быть >= MAX_CONTENT_LENGTH
    # (10 МБ) из окружения.
    client_max_body_size 12m;

    # --- Доступ ---------------------------------------------------------
    # Сейчас ограничений нет: сервис доступен всем, кто дотягивается до
    # этого адреса. Встроенной авторизации в приложении тоже нет.
    #
    # Минимально разумная защита - пустить только свою сеть. Раскомментируйте
    # и подставьте реальные диапазоны:
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;
    #
    # Строже - пароль (потребуется apt install apache2-utils
    # и htpasswd -c /etc/nginx/ipsas.htpasswd ipsas-admin):
    # auth_basic "IPSAS";
    # auth_basic_user_file /etc/nginx/ipsas.htpasswd;

    # Служебные проверки: наружу не отдаём.
    location = /health {
        proxy_pass http://ipsas_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://ipsas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # --- Как перейти на HTTPS, когда появится сертификат ----------------
    # 1) получить сертификат и положить .crt/.key в /etc/ssl;
    # 2) заменить блок listen выше на:
    #       listen 443 ssl http2;
    #       ssl_certificate     /etc/ssl/certs/ipsas.crt;
    #       ssl_certificate_key /etc/ssl/private/ipsas.key;
    # 3) в /etc/ipsas/ipsas.env поменять SESSION_COOKIE_SECURE на true
    #    и перезапустить: sudo systemctl restart ipsas;
    # 4) (желательно) добавить редирект с 80 на 443 отдельным блоком server.
}
